name: 'Gemini PRレビュー'

# PRに「@gemini-cli /review」とコメントすると、GeminiがそのPRをレビューする。
# - 呼べるのはリポジトリのオーナーだけ（公開repoなので、ほかの人がAPIのクレジットを使えないようにする）
# - Geminiができるのは、PRを読むこととレビューコメントを書くことだけ。コードの変更やpushはしない
# - 必要な Secret: GEMINI_API_KEY（Google AI Studio で発行したAPIキー。AI Pro のログインは使わない）
# - 任意の Variable: GEMINI_MODEL（使うモデル。空ならGemini CLIの既定）
# 元にしたもの: google-github-actions/run-gemini-cli の examples/workflows/pr-review

on:
  issue_comment:
    types:
      - 'created'

concurrency:
  group: '${{ github.workflow }}-${{ github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  review:
    if: |-
      github.event.issue.pull_request &&
      github.event.sender.type == 'User' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '@gemini-cli /review')
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8' # v6
        with:
          persist-credentials: 'false'

      - name: 'Prepare prompt context'
        run: |-
          mkdir -p .gemini
          jq -n \
            --arg repo "${REPOSITORY}" \
            --arg pr "${PULL_REQUEST_NUMBER}" \
            --arg context "${ADDITIONAL_CONTEXT}" \
            '{repository: $repo, pull_request_number: $pr, additional_context: $context}' > .gemini/context.json
        env:
          REPOSITORY: '${{ github.repository }}'
          PULL_REQUEST_NUMBER: '${{ github.event.issue.number }}'
          # コメントの「/review」の後ろに書いた内容を、追加の指示として渡す（入力は環境変数経由で渡し、スクリプトに埋め込まない）
          ADDITIONAL_CONTEXT: 'レビューは日本語で書いてください。リポジトリの AGENTS.md（GEMINI.md から読み込まれる）のルールも踏まえてください。 ${{ github.event.comment.body }}'

      # code-review 拡張は、ふつうの git で先に取ってきてローカルパスから入れる。
      # Gemini CLI に GitHub の URL を直接渡すと、ランナーの GIT_CONFIG_SYSTEM のせいで
      # clone が「allowUnsafeConfigPaths」エラーで失敗するため（2026-11-20 に発生）。
      # 中身が勝手に変わらないよう、コミットを固定する。更新するときはこの SHA を変える
      - name: 'Fetch code-review extension'
        run: |-
          git init -q "${EXT_DIR}"
          git -C "${EXT_DIR}" fetch -q --depth 1 https://github.com/gemini-cli-extensions/code-review "${EXT_SHA}"
          git -C "${EXT_DIR}" checkout -q FETCH_HEAD
          rm -rf "${EXT_DIR}/.git"
        env:
          EXT_DIR: '${{ runner.temp }}/code-review'
          EXT_SHA: 'dd1a10d2c9d07b2ebade866590fdfa59cd8f9d04'

      - name: 'Run Gemini pull request review'
        id: 'gemini_review'
        uses: 'google-github-actions/run-gemini-cli@v0'
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: '${{ github.token }}'
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
        with:
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_model: '${{ vars.GEMINI_MODEL }}'
          workflow_name: 'gemini-review'
          # Geminiの返答と道具の呼び出し記録を、実行結果の Artifacts（gemini-output）に残す。
          # レビューが投稿されなかったときの原因調べ用。APIキーなどの Secret は含まれない
          upload_artifacts: 'true'
          # issue_comment から呼ばれるので、PR番号を明示する
          github_pr_number: '${{ github.event.issue.number }}'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "add_comment_to_pending_review",
                    "pull_request_read",
                    "pull_request_review_write"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": ["activate_skill"]
              }
            }
          # 組み込みの道具は activate_skill（拡張の SKILL.md を読み込むだけ）以外すべて無効。
          # レビュー手順が「code-review-commons スキルを有効にして」と指示するため、これがないと
          # モデルが存在しない道具を呼ぼうとして MALFORMED_FUNCTION_CALL で止まる（2026-11-20 に発生）
          extensions: |
            [
              "${{ runner.temp }}/code-review"
            ]
          prompt: '/pr-code-review'

      # Geminiの返答とエラーをログにも出す（Artifactsが読めない環境でも原因を追えるように）
      - name: 'Show Gemini output'
        if: '${{ always() }}'
        run: |-
          echo '::: Gemini response :::'
          printf '%s\n' "${GEMINI_RESPONSE}"
          echo '::: Gemini errors :::'
          printf '%s\n' "${GEMINI_ERRORS}" | tail -n 80
          if [[ -f .gemini/telemetry.log ]]; then
            echo '::: Tool calls :::'
            grep -o '"gemini_cli\.[a-z_.]*"' .gemini/telemetry.log | sort | uniq -c || true
            grep -o '"function_name": *"[^"]*"\|"success": *[a-z]*\|"error": *"[^"]\{0,300\}' .gemini/telemetry.log | head -n 100 || true
          fi
        env:
          GEMINI_RESPONSE: '${{ steps.gemini_review.outputs.summary }}'
          GEMINI_ERRORS: '${{ steps.gemini_review.outputs.error }}'
