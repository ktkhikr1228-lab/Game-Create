name: 'Gemini PRレビュー'

# PRに「@gemini-cli /review」とコメントすると、GeminiがそのPRをレビューして、結果をPRにコメントする。
# - 呼べるのはリポジトリのオーナーだけ（公開repoなので、ほかの人がAPIのクレジットを使えないようにする）
# - 「/review」の後ろに書いた文は、追加の指示としてGeminiに渡す（例: @gemini-cli /review 安全性を重点的に）
# - 差分は tools/pr_review.py がGitHubのAPIで取ってきてGeminiに渡す。Geminiには道具を持たせず、
#   返ってきた文章をこのワークフローが投稿するだけ（コードの変更やpushはしない）
# - 必要な Secret: GEMINI_API_KEY（Google AI Studio で発行したAPIキー。AI Pro のログインは使わない）
# - 任意の Variable: GEMINI_MODEL（使うモデル。空なら gemini-4-argon。「@medium」などでエフォート指定可）
#
# 以前は google-github-actions/run-gemini-cli（Gemini CLI + GitHub MCP + code-review 拡張）を使っていたが、
# 2026-11-20 の試験で、拡張の手順が前提にする道具と設定が噛み合わず、レビューが投稿されなかったため置き換えた。

on:
  issue_comment:
    types:
      - 'created'

concurrency:
  group: '${{ github.workflow }}-${{ github.event.issue.number }}'
  cancel-in-progress: true

jobs:
  review:
    if: |-
      github.event.issue.pull_request &&
      github.event.sender.type == 'User' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '@gemini-cli /review')
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'read'
    steps:
      # main の版（ルールと企画の正本）を読む。PRのブランチのコードは実行しない
      - name: 'Checkout repository'
        uses: 'actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8' # v6
        with:
          persist-credentials: 'false'

      - name: 'Review with Gemini'
        run: python3 tools/pr_review.py
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          PR_NUMBER: '${{ github.event.issue.number }}'
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          GEMINI_MODEL: '${{ vars.GEMINI_MODEL }}'
          # コメント本文は環境変数で渡す（スクリプトに埋め込まない）
          REVIEW_REQUEST: '${{ github.event.comment.body }}'
