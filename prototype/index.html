<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<title>試作の入口</title>
<!-- 試作の入口。開くたびに GitHub に「いちばん新しいコミット」を聞いて、そのコミットの版へのリンクを作る。
     コミットごとのURLは中身が変わらないので、キャッシュで古い版が出ることがない。
     この入口のページ自体は中身が固定なので、キャッシュされても困らない。 -->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #141c25; color: #e8eef4; font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  #ver { font-size: 13px; color: #9fb3c8; margin-bottom: 16px; line-height: 1.6; }
  #ver b { color: #ffd34a; font-weight: normal; }
  a.card { display: block; text-decoration: none; color: inherit; background: #1d2834; border: 1px solid #2c3b4b; border-radius: 12px; padding: 12px 14px; margin: 8px 0; }
  a.card:active { background: #26364a; }
  a.card .t { font-size: 15px; font-weight: bold; }
  a.card .d { font-size: 12px; color: #9fb3c8; margin-top: 2px; }
  h2 { font-size: 13px; color: #9fb3c8; margin: 20px 0 4px; font-weight: normal; }
  .err { color: #ff9a8a; font-size: 13px; }
  button { font: inherit; color: inherit; background: #2c3b4b; border: 0; border-radius: 8px; padding: 6px 12px; }
</style>
</head>
<body>
<main>
  <h1>試作の入口</h1>
  <div id="ver">いちばん新しい版を調べています…</div>
  <div id="list"></div>
</main>
<script>
const REPO = 'ktkhikr1228-lab/Game-Create';
const BRANCHES = ['claude/project-thread-tawm9z', 'main'];   // 作業中のブランチ、なければ main
const INFO = {
  'phaser-bronze-scene.html': ['青銅の剣の場面（Phaser版）', '町・川・岩殻虫・るつぼ。いま試してほしいもの', 1],
  'phaser-sandbox.html': ['歩いて掘る（Phaser版）', '広い世界を歩いて掘る。ツルハシの硬さはデバッグで変えられる', 1],
  'phaser-check.html': ['Phaserの動作確認', '最初に作った、Phaserが動くかだけの確認', 1],
  'bronze-sword-scene.html': ['青銅の剣の場面（前の版）', 'Phaserに移す前の版', 2],
  'worldgen-sandbox.html': ['世界の生成（地図で見る）', '地域・地層・鉱石の並びを地図で見る', 2],
  'komorebi-caverns.html': ['木漏れ日の洞窟（初期の試作）', '', 2],
  'komorebi-demo-cell-mining.html': ['細かいセルで掘る（初期の試作）', '', 2],
};
const params = new URLSearchParams(location.search);
const api = path => fetch(`https://api.github.com/repos/${REPO}/${path}`, {cache: 'no-store'}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
const fmt = iso => new Date(iso).toLocaleString('ja-JP', {month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'});

async function main() {
  let commit = null, branch = null;
  for (const b of params.get('ref') ? [params.get('ref')] : BRANCHES) {
    try { commit = await api(`commits/${encodeURIComponent(b)}`); branch = b; break; } catch (e) {}
  }
  if (!commit) throw new Error('コミットを取得できませんでした');
  const sha = commit.sha, files = await api(`contents/prototype?ref=${sha}`);
  const msg = commit.commit.message.split('\n')[0];
  document.getElementById('ver').innerHTML =
    `版 <b>${sha.slice(0, 7)}</b>（${fmt(commit.commit.committer.date)} 更新）<br>${msg.replace(/[<&]/g, c => ({'<': '&lt;', '&': '&amp;'})[c])}` +
    (branch !== BRANCHES[0] ? `<br>（${branch} の版）` : '');
  const html = files.filter(f => f.name.endsWith('.html') && f.name !== 'index.html');
  const order = n => { const i = Object.keys(INFO).indexOf(n); return i < 0 ? 99 : i; };
  html.sort((a, b) => order(a.name) - order(b.name) || a.name.localeCompare(b.name));
  const list = document.getElementById('list');
  let group = 0;
  for (const f of html) {
    const [title, desc, g] = INFO[f.name] || [f.name, '', 3];
    if (g !== group) { group = g; const h = document.createElement('h2'); h.textContent = g === 1 ? 'Phaser版（いま試すもの）' : g === 2 ? '前の試作' : 'そのほか'; list.appendChild(h); }
    const a = document.createElement('a'); a.className = 'card';
    a.href = `https://raw.githack.com/${REPO}/${sha}/prototype/${f.name}`;
    a.innerHTML = `<div class="t"></div><div class="d"></div>`;
    a.querySelector('.t').textContent = title; a.querySelector('.d').textContent = desc;
    list.appendChild(a);
  }
}
main().catch(e => {
  document.getElementById('ver').innerHTML = `<span class="err">いちばん新しい版を調べられませんでした（${e.message}）。少し待ってから開き直してください。</span> <button onclick="location.reload()">開き直す</button>`;
});
</script>
</body>
</html>
