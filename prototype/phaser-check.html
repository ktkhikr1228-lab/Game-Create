<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Phaser 動作確認</title>
<!-- 使い捨ての試作。Phaser がブラウザとスマホで、このゲームの基本操作に足りるかを確かめる -->
<style>
  html,body{margin:0;height:100%;background:#0d0f12;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #game{position:fixed;inset:0}
  #top{position:fixed;left:calc(8px + env(safe-area-inset-left));right:calc(8px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top));display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:6px;pointer-events:none}
  #hud{color:#e8e4da;font:12px/1.5 ui-monospace,Menlo,monospace;background:rgba(0,0,0,.45);padding:6px 8px;border-radius:6px;white-space:pre}
  #pad{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:0 calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));pointer-events:none}
  #pad .grp{display:flex;gap:10px;pointer-events:auto}
  #pad button{width:64px;height:64px;border-radius:14px;border:2px solid rgba(255,255,255,.35);background:rgba(20,22,26,.55);color:#fff;font-size:24px;touch-action:none}
  #pad button.on{background:rgba(200,140,60,.7)}
  body.touch #pad{display:flex}
  #help{color:#cfc8b8;font:12px/1.5 system-ui,sans-serif;background:rgba(0,0,0,.45);padding:6px 8px;border-radius:6px;max-width:260px}
  body.touch #help .pc{display:none} body:not(.touch) #help .sp{display:none}
</style>
</head>
<body>
<div id="game"></div>
<div id="top">
<div id="hud"></div>
<div id="help">
  <div class="pc">A D / ← → 歩く　W・Space ジャンプ<br>左クリック長押しで掘る　右クリックで置く<br>E 掘る/置くの切り替え</div>
  <div class="sp">◀ ▶ 歩く　⤒ ジャンプ<br>画面を長押しで掘る（🧱のときはタップで置く）</div>
</div>
</div>
<div id="pad">
  <div class="grp"><button id="bL" aria-label="左">◀</button><button id="bR" aria-label="右">▶</button></div>
  <div class="grp"><button id="bM" aria-label="掘る/置く">⛏</button><button id="bJ" aria-label="ジャンプ">⤒</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js"></script>
<script>
'use strict';
const Q = new URLSearchParams(location.search);
// ---- 決定済みの数字（docs/design.md §8） ----
const T = 18;              // 1ブロック 18px
const PW = 2, PH = 3;      // 主人公は横2×縦3ブロック（の枠）
const HERO_W = 22;         // 見た目と当たり判定の幅 px（この試作の仮の数字）
const JUMP_BLOCKS = 4;     // ジャンプで4ブロックの段差まで
// ---- この試作だけの仮の数字 ----
const W = 240, H = 140;    // ワールドの広さ（ブロック）
const GRAV = 1500, SPEED = 170, REACH = 5;
const VIEW_BLOCKS = +(Q.get('zoom') || 26);  // 画面の短い辺に映るブロック数（?zoom=で変えられる）

const touch = Q.has('touch') ? Q.get('touch') === '1' : (matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window);
if (touch) document.body.classList.add('touch');

// タイル番号（0 は空）
const B = { GRASS:1, DIRT:2, STONE:3, COPPER:4, TIN:5, BEDROCK:6, PLANK:7 };
const INFO = {
  1:{name:'草地', c:'#5f9a3c', top:'#86c45a', time:.25, drop:'土'},
  2:{name:'土',   c:'#7a5636', time:.3,  drop:'土'},
  3:{name:'岩',   c:'#6d6f73', time:.7,  drop:'岩'},
  4:{name:'自然銅', c:'#6d6f73', ore:'#d07a3a', time:.9, drop:'自然銅'},
  5:{name:'錫石', c:'#6d6f73', ore:'#2c2622', time:.9, drop:'錫石'},
  6:{name:'岩盤', c:'#2a2b2f', time:Infinity},
  7:{name:'板',   c:'#b08a52', time:.3,  drop:'板'},
};

// ---- 乱数とワールド生成（簡単なもの。本番の生成ではない） ----
function rng(seed){ let s = 0; for (const ch of String(seed)) s = (s*31 + ch.charCodeAt(0)) >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t>>>15, t|1); t ^= t + Math.imul(t ^ t>>>7, t|61); return ((t ^ t>>>14) >>> 0) / 4294967296; }; }
const seed = Q.get('seed') || 'komorebi';
const R = rng(seed);
function genWorld(){
  const g = Array.from({length:H}, () => new Uint8Array(W));
  const p1 = R()*6, p2 = R()*6;
  const surf = [];
  for (let x = 0; x < W; x++) {
    let h = 34 + Math.sin(x/17 + p1)*4 + Math.sin(x/7.3 + p2)*1.6;
    if (x > 20 && x < 44) h = 34;                        // 出発地点は平らに
    surf[x] = Math.round(h);
  }
  // 段差が4ブロックを超えないようにならす（決定済みのルール）
  for (let x = 1; x < W; x++) surf[x] = Math.max(surf[x-1]-JUMP_BLOCKS, Math.min(surf[x-1]+JUMP_BLOCKS, surf[x]));
  for (let x = 0; x < W; x++) for (let y = surf[x]; y < H; y++) {
    const d = y - surf[x];
    g[y][x] = d === 0 ? B.GRASS : d < 5 + (x*7 % 3) ? B.DIRT : B.STONE;
    if (y >= H-3) g[y][x] = B.BEDROCK;
  }
  // 洞窟：ランダムウォークで高さ3以上の通路を掘る
  for (let k = 0; k < 14; k++) {
    let x = 10 + R()*(W-20), y = 48 + R()*(H-62), a = R()*Math.PI*2;
    for (let s = 0; s < 120; s++) {
      a += (R()-.5)*.6; x += Math.cos(a); y += Math.sin(a)*.5;
      const r = 1.6 + R()*1.2;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
        const cx = Math.round(x+dx), cy = Math.round(y+dy);
        if (cx < 1 || cx >= W-1 || cy < 40 || cy >= H-4) continue;
        if (dx*dx + dy*dy*0.6 <= r*r) g[cy][cx] = 0;
      }
    }
  }
  // 鉱石：銅は浅め、錫は少しだけ
  const vein = (id, n, y0, y1, size) => { for (let k = 0; k < n; k++) { let x = Math.floor(R()*W), y = Math.floor(y0 + R()*(y1-y0)); for (let s = 0; s < size; s++) { if (g[y] && g[y][x] === B.STONE) g[y][x] = id; x += Math.round(R()*2-1); y += Math.round(R()*2-1); } } };
  vein(B.COPPER, 90, 40, 100, 7);
  vein(B.TIN, 30, 50, 120, 5);
  return { g, surf };
}

// ---- タイル画像をcanvasで作る（にじみ防止に1pxずつ外側へ伸ばす） ----
function makeTiles(scene){
  const n = 8, M = 1, S = 2, cv = document.createElement('canvas');
  cv.width = M*2 + n*T + (n-1)*S; cv.height = T + M*2;
  const c = cv.getContext('2d');
  const r = rng('tiles');
  for (let i = 1; i < n; i++) {
    const inf = INFO[i], ox = M + i*(T+S), oy = M;
    c.fillStyle = inf.c; c.fillRect(ox, oy, T, T);
    for (let k = 0; k < 14; k++) { c.fillStyle = r() < .5 ? 'rgba(0,0,0,.12)' : 'rgba(255,255,255,.07)'; c.fillRect(ox + Math.floor(r()*T), oy + Math.floor(r()*T), 2, 2); }
    if (inf.top) { c.fillStyle = inf.top; c.fillRect(ox, oy, T, 4); }
    if (inf.ore) { c.fillStyle = inf.ore; for (const [a,b] of [[3,4],[10,3],[6,10],[12,12],[2,13]]) c.fillRect(ox+a, oy+b, 4, 3); }
    if (i === B.PLANK) { c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(ox, oy+8, T, 1); c.fillRect(ox+9, oy, 1, 8); c.fillRect(ox+4, oy+9, 1, 9); }
    if (i === B.BEDROCK) { c.fillStyle = 'rgba(255,255,255,.06)'; c.fillRect(ox+2, oy+2, 6, 6); c.fillRect(ox+10, oy+10, 6, 6); }
    // 外側1pxに端の色をコピー
    c.drawImage(cv, ox, oy, 1, T, ox-1, oy, 1, T); c.drawImage(cv, ox+T-1, oy, 1, T, ox+T, oy, 1, T);
    c.drawImage(cv, ox-1, oy, T+2, 1, ox-1, oy-1, T+2, 1); c.drawImage(cv, ox-1, oy+T-1, T+2, 1, ox-1, oy+T, T+2, 1);
  }
  scene.textures.addCanvas('tiles', cv);
  return { M, S };
}

let world, scene, layer, player, cracks, cursorBox, inv = {}, mode = 'dig';
const input = { L:false, R:false, J:false };
let digT = null, digP = 0, fpsSamples = [];

class Main extends Phaser.Scene {
  create(){
    scene = this;
    world = genWorld();
    const { M, S } = makeTiles(this);
    const map = this.make.tilemap({ tileWidth:T, tileHeight:T, width:W, height:H });
    const ts = map.addTilesetImage('tiles', 'tiles', T, T, M, S, 0);
    layer = map.createBlankLayer('ground', ts, 0, 0, W, H, T, T);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (world.g[y][x]) layer.putTileAt(world.g[y][x], x, y);
    layer.setCollision([1,2,3,4,5,6,7]);

    // 背景（空と地下の色）
    this.cameras.main.setBackgroundColor('#8fb8d8');
    const under = this.add.rectangle(0, 40*T, W*T, (H-40)*T, 0x1c1916).setOrigin(0).setDepth(-1);

    // 主人公。2×3ブロックの枠に収まる人の形にする（Terrariaと同じく、見た目と当たり判定は枠より細い）
    // 当たり判定は幅 HERO_W px（1ブロックより太いので、幅1の穴は通れない）
    const g = this.add.graphics(), cw = HERO_W, ch = PH*T;
    g.fillStyle(0xe8c9a0).fillRect(5, 1, 12, 12);            // 頭
    g.fillStyle(0x3b2a1c).fillRect(4, 0, 14, 4);             // 髪
    g.fillStyle(0x111111).fillRect(13, 6, 2, 3);             // 目
    g.fillStyle(0x2f4f7a).fillRect(3, 14, 16, 20);           // 胴
    g.fillStyle(0x6b4a2a).fillRect(3, 30, 16, 3);            // ベルト
    g.fillStyle(0x24324a).fillRect(4, 34, 6, 16).fillRect(12, 34, 6, 16); // 脚
    g.fillStyle(0x3b2a1c).fillRect(3, 50, 7, 4).fillRect(12, 50, 7, 4);   // 靴
    g.generateTexture('hero', cw, ch); g.destroy();
    const sx = 30;
    player = this.physics.add.sprite(sx*T + T, (world.surf[sx]-PH)*T, 'hero').setOrigin(0.5, 0);
    player.body.setSize(HERO_W, PH*T - 2).setOffset(0, 2);
    player.body.setMaxVelocity(SPEED, 900);
    this.physics.add.collider(player, layer);
    this.physics.world.setBounds(0, 0, W*T, H*T);
    player.setCollideWorldBounds(true);

    cracks = this.add.graphics().setDepth(5);
    cursorBox = this.add.graphics().setDepth(6);

    const cam = this.cameras.main;
    cam.setBounds(0, 0, W*T, H*T);
    cam.startFollow(player, true, 0.15, 0.15, 0, -PH*T/2);
    const fit = () => { const s = Math.min(this.scale.width, this.scale.height); cam.setZoom(s / (VIEW_BLOCKS*T)); };
    fit(); this.scale.on('resize', fit);

    // キー
    this.keys = this.input.keyboard.addKeys('A,D,W,SPACE,LEFT,RIGHT,UP,E');
    this.keys.E.on('down', () => setMode(mode === 'dig' ? 'place' : 'dig'));
    this.input.mouse && this.input.mouse.disableContextMenu();
    this.input.addPointer(3);
    this.input.on('pointerdown', p => { if (mode === 'place' || p.rightButtonDown()) tryPlace(p); });
  }

  update(time, dtMs){
    const dt = dtMs/1000;
    fpsSamples.push(dtMs); if (fpsSamples.length > 60) fpsSamples.shift();
    const k = this.keys, b = player.body;
    const left = input.L || k.A.isDown || k.LEFT.isDown, right = input.R || k.D.isDown || k.RIGHT.isDown;
    const jump = input.J || k.W.isDown || k.SPACE.isDown || k.UP.isDown;
    b.setGravityY(GRAV - this.physics.world.gravity.y);
    b.setVelocityX(left === right ? 0 : left ? -SPEED : SPEED);
    if (left !== right) player.setFlipX(left);
    const onFloor = b.blocked.down;
    if (jump && onFloor) b.setVelocityY(-Math.sqrt(2*GRAV*(JUMP_BLOCKS*T + 6)));

    // 掘る
    const p = this.input.activePointer;
    const target = pointerTile(p);
    cursorBox.clear();
    if (target && inReach(target.x, target.y)) {
      cursorBox.lineStyle(1, mode === 'dig' ? 0xffffff : 0xf0c060, 0.8).strokeRect(target.x*T+.5, target.y*T+.5, T-1, T-1);
    }
    const holding = mode === 'dig' && p.isDown && !p.rightButtonDown() && p.downElement === this.game.canvas;
    if (holding && target && inReach(target.x, target.y) && solid(target.x, target.y)) {
      if (!digT || digT.x !== target.x || digT.y !== target.y) { digT = target; digP = 0; }
      const tile = layer.getTileAt(target.x, target.y);
      digP += dt / INFO[tile.index].time;
      if (digP >= 1) {
        const inf = INFO[tile.index];
        layer.removeTileAt(target.x, target.y);
        inv[inf.drop] = (inv[inf.drop] || 0) + 1;
        digT = null; digP = 0;
      }
    } else { digT = null; digP = 0; }
    cracks.clear();
    if (digT && digP > 0) { cracks.fillStyle(0x000000, 0.15 + digP*0.5).fillRect(digT.x*T, digT.y*T + T*(1-digP), T, T*digP); }

    // 表示
    const avg = fpsSamples.reduce((a,c)=>a+c,0)/fpsSamples.length;
    const tx = Math.floor(player.x / T), ty = Math.floor(player.y / T);
    const look = target && layer.getTileAt(target.x, target.y);
    document.getElementById('hud').textContent =
      `Phaser ${Phaser.VERSION}  ${Math.round(1000/avg)} fps\n` +
      `位置 ${tx},${ty}  地表から ${Math.max(0, ty + PH - world.surf[Math.min(W-1, Math.max(0, tx))])} ブロック\n` +
      `モード ${mode === 'dig' ? '⛏ 掘る' : '🧱 置く'}  指している ${look ? INFO[look.index].name : '—'}\n` +
      `持ち物 ${Object.entries(inv).map(([n,c]) => n+'×'+c).join(' ') || 'なし'}`;
  }
}

function solid(x, y){ if (x < 0 || x >= W || y < 0 || y >= H) return true; const t = layer.getTileAt(x, y); return !!t && t.index > 0; }
function pointerTile(p){ if (!p || (p.x === 0 && p.y === 0 && !p.isDown && touch)) return null; const w = scene.cameras.main.getWorldPoint(p.x, p.y); return { x: Math.floor(w.x / T), y: Math.floor(w.y / T) }; }
function inReach(x, y){ const cx = player.x / T, cy = (player.y + PH*T/2) / T; return Math.hypot(x + .5 - cx, y + .5 - cy) <= REACH + 1; }
function tryPlace(p){
  if (p.downElement !== scene.game.canvas) return;
  const t = pointerTile(p); if (!t || !inReach(t.x, t.y) || solid(t.x, t.y)) return;
  const b = player.body, r = new Phaser.Geom.Rectangle(t.x*T + 1, t.y*T + 1, T - 2, T - 2);
  if (Phaser.Geom.Intersects.RectangleToRectangle(r, new Phaser.Geom.Rectangle(b.x, b.y, b.width, b.height))) return;
  // 隣にブロックがある場所にだけ置ける
  if (!(solid(t.x-1,t.y) || solid(t.x+1,t.y) || solid(t.x,t.y-1) || solid(t.x,t.y+1))) return;
  layer.putTileAt(B.PLANK, t.x, t.y);
}
function setMode(m){ mode = m; const b = document.getElementById('bM'); b.textContent = m === 'dig' ? '⛏' : '🧱'; b.classList.toggle('on', m === 'place'); }

// スマホのボタン
for (const [id, key] of [['bL','L'],['bR','R'],['bJ','J']]) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); input[key] = true; el.classList.add('on'); };
  const off = e => { e.preventDefault(); input[key] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('pointerleave', off);
}
document.getElementById('bM').addEventListener('pointerdown', e => { e.preventDefault(); setMode(mode === 'dig' ? 'place' : 'dig'); });

const DPR = Math.min(3, window.devicePixelRatio || 1);
window.game = new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  pixelArt: true,
  backgroundColor: '#0d0f12',
  // 画面の実ピクセルで描く（スマホでもにじまない）。CSS上は 1/dpr に縮めて表示
  scale: { mode: Phaser.Scale.NONE, width: innerWidth*DPR, height: innerHeight*DPR, zoom: 1/DPR },
  physics: { default: 'arcade', arcade: { gravity: { y: GRAV }, tileBias: 20 } },
  input: { activePointers: 4 },
  scene: Main,
});
let rt = 0;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { game.scale.resize(innerWidth*DPR, innerHeight*DPR); game.scale.setZoom(1/DPR); }, 100); });
</script>
</body>
</html>
